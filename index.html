<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not just a website — a story.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Archivo:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MotionPathPlugin.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:    #FAF7F2;
      --charcoal: #1C1C1E;
      --muted:    #6B6B70;
      --accent:   #2563EB;
    }

    html { scroll-behavior: auto; }
    body {
      background: var(--cream);
      font-family: 'Archivo', sans-serif;
      overflow-x: hidden;
    }

    /* ══════════════════════════════════════════
       SCROLL SECTION  (500vh scroll space)
    ══════════════════════════════════════════ */
    #scroll-section { height: 500vh; }

    /* ── Sticky viewport ── */
    #sticky-viewport {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      /* Desk surface visible once MacBook zooms back */
      background: radial-gradient(ellipse at 50% 30%, #eee8de 0%, #FAF7F2 80%);
    }

    /* ══════════════════════════════════════════
       DEVICE SCENE
       This is the element GSAP scales.
       Starts large (screen fills viewport),
       pulls back to reveal the MacBook frame.
    ══════════════════════════════════════════ */
    #device-scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      will-change: transform;
    }

    /* Lateral wrap — holds all 3 devices in a row */
    #lateral-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── MacBook wrap ── */
    #laptop-wrap {
      position: relative;
      /* SVG viewBox 1000×680 → aspect ratio 1000:680 */
      width: min(960px, 90vw);
      aspect-ratio: 1000 / 680;
      flex-shrink: 0;
      /* Elegant shadow — only visible once MacBook zooms back */
      filter: drop-shadow(0 32px 64px rgba(0,0,0,0.22))
              drop-shadow(0 8px 16px rgba(0,0,0,0.12));
    }

    /* ══════════════════════════════════════════
       LAPTOP SCREEN CONTENT
       Sits behind the MacBook SVG frame.
       Positioned to align exactly with the
       screen hole in the SVG (see maths below).

       SVG viewBox: 1000 × 680
       Screen rect:  x=90  y=30  w=820  h=510
       ─ left%  = 90/1000      = 9%
       ─ top%   = 30/680       = 4.41%
       ─ width% = 820/1000     = 82%
       ─ height%= 510/680      = 75%
    ══════════════════════════════════════════ */
    #laptop-screen-content {
      position: absolute;
      left:   9%;
      top:    4.41%;
      width:  82%;
      height: 75%;
      overflow: hidden;
      background: #0a0a0a;
      z-index: 1;
    }

    /* ── Meadow photo — fills the screen ── */
    #meadow-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 60%;
      display: block;
    }

    /* ── Berry bush — right side, hidden until bee arrives ── */
    #berry-bush-container {
      position: absolute;
      right: 6%;
      bottom: 4%;
      width: 26%;
      height: 48%;
      opacity: 0;
      transform: scale(0.88) translateY(10px);
      will-change: opacity, transform;
      z-index: 3;
    }
    #berry-bush-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 48% 52% 44% 56% / 42% 44% 56% 58%;
      /* Vignette blend to make it feel embedded in the scene */
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.4));
    }

    /* ── Bee ── */
    #bee-container {
      position: absolute;
      /* Starting position: lower-left, on a flower */
      left: 21%;
      top:  56%;
      width: 72px;
      height: 72px;
      transform-origin: center center;
      will-change: transform;
      z-index: 5;
    }
    /* Separate visual wrapper so GSAP (position) and CSS (wiggle) don't conflict */
    #bee-visual {
      width: 100%;
      height: 100%;
    }
    #bee-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      filter: drop-shadow(0 3px 12px rgba(0,0,0,0.5));
    }

    /* Flying wiggle — applied via JS class toggle */
    .bee-flying #bee-visual {
      animation: beeWiggle 0.18s ease-in-out infinite;
    }
    @keyframes beeWiggle {
      0%, 100% { transform: translateY(0)   rotate(-6deg) scale(1);    filter: blur(0.4px); }
      50%       { transform: translateY(-5px) rotate(6deg)  scale(1.04); filter: blur(1px);   }
    }

    /* ── E-commerce nav overlay (fades in when MacBook is revealed) ── */
    #ecom-nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 13%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      background: rgba(18, 18, 20, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      will-change: opacity;
      z-index: 6;
    }
    .ecom-brand {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(0.55rem, 1.1vw, 0.9rem);
      letter-spacing: 0.12em;
      color: #fff;
    }
    .ecom-links {
      display: flex;
      gap: clamp(0.5rem, 1.2vw, 1.2rem);
      font-size: clamp(0.42rem, 0.8vw, 0.7rem);
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.08em;
    }
    .ecom-cta {
      background: var(--accent);
      color: #fff;
      font-family: 'Archivo', sans-serif;
      font-size: clamp(0.38rem, 0.7vw, 0.62rem);
      font-weight: 600;
      padding: 0.3em 0.8em;
      border-radius: 3px;
      border: none;
      cursor: pointer;
      letter-spacing: 0.05em;
    }

    /* ══════════════════════════════════════════
       MACBOOK SVG FRAME
       Renders on top of screen-content.
       The screen area in the SVG is intentionally
       left empty (transparent) so screen-content
       shows through.
    ══════════════════════════════════════════ */
    #laptop-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* ══════════════════════════════════════════
       TABLET  (left of laptop)
    ══════════════════════════════════════════ */
    #tablet-device {
      position: absolute;
      right: calc(100% + 24px);
      top: 50%;
      transform: translateY(-50%) translateX(30px);
      width: 20%;
      min-width: 120px;
      opacity: 0;
      will-change: opacity, transform;
    }

    /* ══════════════════════════════════════════
       PHONE  (right of laptop)
    ══════════════════════════════════════════ */
    #phone-device {
      position: absolute;
      left: calc(100% + 20px);
      top: 50%;
      transform: translateY(-50%) translateX(-30px);
      width: 10%;
      min-width: 60px;
      opacity: 0;
      will-change: opacity, transform;
    }

    /* ══════════════════════════════════════════
       HERO TEXT  (floats above everything)
    ══════════════════════════════════════════ */
    #hero-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
      text-align: center;
      padding: 2rem;
    }
    #hero-headline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(2.5rem, 5.5vw, 5.5rem);
      color: #fff;
      letter-spacing: -0.04em;
      line-height: 1.05;
      text-shadow: 0 2px 40px rgba(0,0,0,0.4), 0 1px 6px rgba(0,0,0,0.25);
      will-change: opacity, transform;
    }
    #hero-sub {
      margin-top: 1.4rem;
      font-family: 'Archivo', sans-serif;
      font-weight: 300;
      font-size: clamp(0.8rem, 1.4vw, 1.1rem);
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      will-change: opacity;
    }

    /* ── Scroll hint ── */
    #scroll-hint {
      position: absolute;
      bottom: 2.4rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #scroll-hint span {
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }
    .scroll-arrow {
      width: 18px;
      height: 18px;
      border-right: 1.5px solid rgba(255,255,255,0.45);
      border-bottom: 1.5px solid rgba(255,255,255,0.45);
      transform: rotate(45deg);
      animation: arrowPulse 1.7s ease-in-out infinite;
    }
    @keyframes arrowPulse {
      0%, 100% { transform: rotate(45deg) translate(0,0);   opacity: 0.4; }
      50%       { transform: rotate(45deg) translate(3px,3px); opacity: 1;   }
    }

    /* ══════════════════════════════════════════
       AFTER SECTION
    ══════════════════════════════════════════ */
    #after-section {
      background: var(--cream);
      text-align: center;
      padding: 9rem 2rem 10rem;
    }
    #after-section h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(2rem, 4vw, 3.8rem);
      color: var(--charcoal);
      letter-spacing: -0.04em;
      margin-bottom: 1.5rem;
    }
    #after-section p {
      max-width: 500px;
      margin: 0 auto 2.5rem;
      color: var(--muted);
      line-height: 1.75;
      font-size: 1.05rem;
    }
    .cta-btn {
      display: inline-block;
      background: var(--charcoal);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      padding: 1rem 2.4rem;
      border-radius: 100px;
      text-decoration: none;
      transition: background 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
    }
    .cta-btn:hover {
      background: var(--accent);
      box-shadow: 0 8px 32px rgba(37,99,235,0.28);
      transform: translateY(-2px);
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .bee-flying #bee-visual,
      .scroll-arrow { animation: none; }
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════
     SCROLLYTELLING SECTION  — 500vh scroll space
═══════════════════════════════════════════════════════ -->
<section id="scroll-section">
  <div id="sticky-viewport">

    <div id="device-scene">
      <div id="lateral-wrap">

        <!-- ① TABLET — left, hidden until State 5 -->
        <div id="tablet-device" aria-hidden="true">
          <svg viewBox="0 0 220 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <clipPath id="tabClip"><rect x="14" y="20" width="192" height="256" rx="3"/></clipPath>
            </defs>
            <!-- Body -->
            <rect x="2" y="2" width="216" height="296" rx="18" fill="#2a2a2e"/>
            <rect x="2" y="2" width="216" height="296" rx="18" fill="none" stroke="#444" stroke-width="1.5"/>
            <!-- Home button strip -->
            <circle cx="110" cy="282" r="9" fill="#3a3a3e" stroke="#555" stroke-width="1"/>
            <!-- Screen -->
            <rect x="14" y="20" width="192" height="256" rx="3" fill="#0a0a0a"/>
            <!-- Website inside screen -->
            <image href="https://images.unsplash.com/photo-1490750967868-88df5691cc08?auto=format&fit=crop&w=400&q=80"
                   x="14" y="20" width="192" height="256" clip-path="url(#tabClip)" preserveAspectRatio="xMidYMid slice"/>
            <!-- Nav overlay -->
            <rect x="14" y="20" width="192" height="28" fill="rgba(18,18,20,0.85)"/>
            <text x="24" y="37" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" fill="white" letter-spacing="1">FLORA</text>
            <rect x="160" y="27" width="38" height="13" rx="3" fill="#2563EB"/>
            <text x="168" y="37" font-family="Archivo,sans-serif" font-size="7" fill="white">Shop</text>
            <!-- Hero text overlay -->
            <rect x="14" y="160" width="192" height="116" fill="url(#tabGrad)"/>
            <defs>
              <linearGradient id="tabGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="transparent"/>
                <stop offset="100%" stop-color="rgba(18,18,20,0.9)"/>
              </linearGradient>
            </defs>
            <text x="24" y="228" font-family="Space Grotesk,sans-serif" font-size="12" font-weight="700" fill="white">Where Nature</text>
            <text x="24" y="244" font-family="Space Grotesk,sans-serif" font-size="12" font-weight="700" fill="white">Meets Home.</text>
            <rect x="24" y="252" width="56" height="14" rx="3" fill="#2563EB"/>
            <text x="32" y="262" font-family="Archivo,sans-serif" font-size="7" fill="white">Shop now</text>
          </svg>
        </div>

        <!-- ② LAPTOP — the main device -->
        <div id="laptop-wrap">

          <!-- ③ SCREEN CONTENT — lives inside the MacBook screen -->
          <div id="laptop-screen-content">

            <!-- Real meadow photo -->
            <img
              id="meadow-img"
              src="https://images.unsplash.com/photo-1490750967868-88df5691cc08?auto=format&fit=crop&w=1920&q=85"
              alt="Vibrant wildflower meadow"
            />

            <!-- Berry bush photo — bee landing target (right side) -->
            <div id="berry-bush-container">
              <img
                src="https://images.unsplash.com/photo-1601004890657-7b5bf8eb1f95?auto=format&fit=crop&w=600&q=85"
                alt="Wild berry bush"
              />
            </div>

            <!-- Bee — starts on a flower in the lower-left of meadow -->
            <div id="bee-container">
              <div id="bee-visual">
                <img
                  src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&w=300&q=90"
                  alt="Macro photograph of a bee"
                />
              </div>
            </div>

            <!-- E-commerce nav — fades in when MacBook is revealed -->
            <div id="ecom-nav" aria-hidden="true">
              <span class="ecom-brand">FLORA</span>
              <div class="ecom-links">
                <span>Shop</span><span>Collections</span><span>About</span><span>Journal</span>
              </div>
              <button class="ecom-cta">View Cart</button>
            </div>

          </div><!-- /laptop-screen-content -->

          <!-- ④ MACBOOK SVG FRAME — rendered above screen-content.
               The screen area (x=90 y=30 w=820 h=510) is intentionally
               left empty so screen-content shows through. -->
          <svg id="laptop-svg" viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"   stop-color="#e0e0e0"/>
                <stop offset="100%" stop-color="#b8b8b8"/>
              </linearGradient>
              <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"   stop-color="#d8d8d8"/>
                <stop offset="100%" stop-color="#a8a8a8"/>
              </linearGradient>
              <linearGradient id="lidEdge" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"   stop-color="#c8c8c8"/>
                <stop offset="100%" stop-color="#909090"/>
              </linearGradient>
            </defs>

            <!-- ── LID ── -->
            <!-- Outer aluminum body -->
            <rect x="44" y="4" width="912" height="558" rx="14" fill="url(#lidGrad)"/>
            <!-- Subtle edge highlight -->
            <rect x="44" y="4" width="912" height="558" rx="14" fill="none" stroke="#999" stroke-width="1.2"/>
            <!-- Inner lid face (slightly darker) -->
            <rect x="52" y="10" width="896" height="548" rx="10" fill="#c8c8c8"/>

            <!-- ── BEZEL  (dark frame around screen) ── -->
            <!-- Top bezel -->
            <rect x="70" y="18" width="860" height="14" fill="#1a1a1e"/>
            <!-- Left bezel -->
            <rect x="70" y="18" width="20" height="528" fill="#1a1a1e"/>
            <!-- Right bezel -->
            <rect x="910" y="18" width="20" height="528" fill="#1a1a1e"/>
            <!-- Bottom bezel -->
            <rect x="70" y="542" width="860" height="16" fill="#1a1a1e"/>

            <!-- Screen area: x=90 y=30 w=820 h=510 is left transparent -->
            <!-- Camera dot -->
            <circle cx="500" cy="12" r="4.5" fill="#2a2a2e"/>
            <circle cx="500" cy="12" r="2"   fill="#111" opacity="0.6"/>

            <!-- ── HINGE ── -->
            <rect x="34"  y="558" width="932" height="10" rx="3" fill="#888"/>
            <rect x="44"  y="560" width="912" height="6"  fill="#aaa" opacity="0.5"/>

            <!-- ── BASE ── -->
            <!-- Main base shape -->
            <path d="M20,568 Q20,572 24,574 L976,574 Q980,572 980,568 Z" fill="#c0c0c0"/>
            <path d="M24,574 L976,574 L956,618 Q952,628 920,630 L80,630 Q48,628 44,618 Z" fill="url(#baseGrad)" stroke="#999" stroke-width="0.8"/>
            <!-- Keyboard -->
            <rect x="90" y="578" width="820" height="40" rx="4" fill="#b0b0b0" opacity="0.45"/>
            <!-- Trackpad -->
            <rect x="380" y="582" width="240" height="28" rx="6" fill="#b8b8b8" stroke="#aaa" stroke-width="0.8"/>
            <!-- Speaker grilles left -->
            <g fill="#888" opacity="0.7">
              <rect x="100" y="584" width="2" height="20" rx="1"/>
              <rect x="106" y="584" width="2" height="20" rx="1"/>
              <rect x="112" y="584" width="2" height="20" rx="1"/>
              <rect x="118" y="584" width="2" height="20" rx="1"/>
              <rect x="124" y="584" width="2" height="20" rx="1"/>
              <rect x="130" y="584" width="2" height="20" rx="1"/>
            </g>
            <!-- Speaker grilles right -->
            <g fill="#888" opacity="0.7">
              <rect x="856" y="584" width="2" height="20" rx="1"/>
              <rect x="862" y="584" width="2" height="20" rx="1"/>
              <rect x="868" y="584" width="2" height="20" rx="1"/>
              <rect x="874" y="584" width="2" height="20" rx="1"/>
              <rect x="880" y="584" width="2" height="20" rx="1"/>
              <rect x="886" y="584" width="2" height="20" rx="1"/>
            </g>
            <!-- Front rubber feet -->
            <ellipse cx="100"  cy="630" rx="14" ry="5" fill="#777" opacity="0.7"/>
            <ellipse cx="900"  cy="630" rx="14" ry="5" fill="#777" opacity="0.7"/>
            <!-- Bottom chamfer -->
            <path d="M44,630 Q44,638 56,640 L944,640 Q956,638 956,630 Z" fill="#b8b8b8"/>
          </svg>

        </div><!-- /laptop-wrap -->

        <!-- ⑤ PHONE — right, hidden until State 5 -->
        <div id="phone-device" aria-hidden="true">
          <svg viewBox="0 0 110 220" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <clipPath id="phoneClip"><rect x="8" y="16" width="94" height="188" rx="8"/></clipPath>
            </defs>
            <!-- Body -->
            <rect x="1" y="1" width="108" height="218" rx="20" fill="#1a1a1e"/>
            <rect x="1" y="1" width="108" height="218" rx="20" fill="none" stroke="#3a3a3e" stroke-width="1.5"/>
            <!-- Dynamic island -->
            <rect x="38" y="7" width="34" height="8" rx="4" fill="#111"/>
            <!-- Screen -->
            <rect x="8" y="16" width="94" height="188" rx="8" fill="#0a0a0a"/>
            <!-- Meadow photo clipped to screen -->
            <image href="https://images.unsplash.com/photo-1490750967868-88df5691cc08?auto=format&fit=crop&w=400&q=80"
                   x="8" y="16" width="94" height="188" clip-path="url(#phoneClip)" preserveAspectRatio="xMidYMid slice"/>
            <!-- Nav -->
            <rect x="8" y="16" width="94" height="22" fill="rgba(18,18,20,0.85)"/>
            <text x="16" y="30" font-family="Space Grotesk,sans-serif" font-size="8" font-weight="700" fill="white" letter-spacing="1">FLORA</text>
            <!-- Bottom gradient + CTA -->
            <defs>
              <linearGradient id="phoneGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="transparent"/>
                <stop offset="100%" stop-color="rgba(18,18,20,0.92)"/>
              </linearGradient>
            </defs>
            <rect x="8" y="140" width="94" height="64" fill="url(#phoneGrad)"/>
            <text x="16" y="168" font-family="Space Grotesk,sans-serif" font-size="8" font-weight="700" fill="white">Nature</text>
            <text x="16" y="180" font-family="Space Grotesk,sans-serif" font-size="8" font-weight="700" fill="white">Meets Home.</text>
            <rect x="16" y="184" width="48" height="13" rx="3" fill="#2563EB"/>
            <text x="24" y="193" font-family="Archivo,sans-serif" font-size="6" fill="white">Shop now</text>
            <!-- Home indicator -->
            <rect x="40" y="207" width="30" height="3" rx="1.5" fill="#444"/>
          </svg>
        </div>

      </div><!-- /lateral-wrap -->
    </div><!-- /device-scene -->

    <!-- ⑥ HERO TEXT — floats above, fades out on scroll -->
    <div id="hero-text">
      <h1 id="hero-headline">not just a website —<br/>a story.</h1>
      <p id="hero-sub">scroll to discover</p>
    </div>

    <!-- Scroll hint -->
    <div id="scroll-hint" aria-hidden="true">
      <span>scroll</span>
      <div class="scroll-arrow"></div>
    </div>

  </div><!-- /sticky-viewport -->
</section><!-- /scroll-section -->

<!-- ══════════════════════════════════════════
     AFTER SECTION
══════════════════════════════════════════ -->
<section id="after-section">
  <h2>Your story, beautifully told.</h2>
  <p>Every great brand deserves a website that doesn't just exist — it captivates, guides, and converts. Across every device, every screen, every scroll.</p>
  <a href="#" class="cta-btn">Let's work together</a>
</section>


<script>
  gsap.registerPlugin(ScrollTrigger, MotionPathPlugin);

  // ── References ──
  const deviceScene      = document.getElementById('device-scene');
  const beeContainer     = document.getElementById('bee-container');
  const berryBush        = document.getElementById('berry-bush-container');
  const ecomNav          = document.getElementById('ecom-nav');
  const heroHeadline     = document.getElementById('hero-headline');
  const heroSub          = document.getElementById('hero-sub');
  const scrollHint       = document.getElementById('scroll-hint');
  const tabletDevice     = document.getElementById('tablet-device');
  const phoneDevice      = document.getElementById('phone-device');

  // ════════════════════════════════════════════════
  //  COMPUTE INITIAL SCALE
  //  Goal: make the MacBook screen fill the viewport
  //
  //  Laptop wrap width at 1× = min(960, 90vw)
  //  Screen width at 1×  = laptopW × 0.82  (= 820/1000)
  //  Screen height at 1× = laptopW × 0.51  (= 510/1000)
  // ════════════════════════════════════════════════
  function computeInitialScale() {
    const laptopW  = Math.min(960, window.innerWidth * 0.9);
    const screenW  = laptopW * 0.82;
    const screenH  = laptopW * 0.51;
    const scaleX   = window.innerWidth  / screenW;
    const scaleY   = window.innerHeight / screenH;
    return Math.max(scaleX, scaleY) * 1.015; // 1.5% overscan prevents any edge gaps
  }

  let INITIAL_SCALE = computeInitialScale();

  // Apply initial scale immediately (before scroll)
  gsap.set(deviceScene, { scale: INITIAL_SCALE, transformOrigin: 'center center' });

  // ════════════════════════════════════════════════
  //  MAIN TIMELINE — scrubbed to scroll position
  // ════════════════════════════════════════════════
  const tl = gsap.timeline({
    scrollTrigger: {
      trigger: '#scroll-section',
      start:   'top top',
      end:     'bottom bottom',
      scrub:   1.3,
      onUpdate: (self) => {
        // Only run wing animation while bee is in-flight
        const p = self.progress;
        beeContainer.classList.toggle('bee-flying', p > 0.09 && p < 0.36);
      },
    },
  });

  // ─── 0.00 → 0.12  :  Hero text fades out ───
  tl.to([heroHeadline, heroSub], {
    opacity: 0,
    y: -24,
    duration: 0.10,
    ease: 'power2.in',
  }, 0.00)
  .to(scrollHint, {
    opacity: 0,
    duration: 0.06,
    ease: 'power2.in',
  }, 0.00);

  // ─── 0.07 → 0.20  :  Berry bush appears ───
  tl.to(berryBush, {
    opacity: 1,
    scale: 1,
    y: 0,
    duration: 0.14,
    ease: 'back.out(1.3)',
  }, 0.07);

  // ─── 0.10 → 0.36  :  BEE FLIES ARC PATH ───
  //  Coordinates are pixel offsets from the bee's
  //  initial CSS position (left:21%, top:56%) inside
  //  screen-content. Berry bush center is approx
  //  right:6%+13% = right:19% = left:81%, bottom:4%+24%=28%.
  //  At a 820×510 screen: bee start ≈ (172, 286).
  //  Berry bush centre ≈ (664, 360). Delta ≈ (492, 74).
  tl.to(beeContainer, {
    duration: 0.26,
    ease: 'power1.inOut',
    motionPath: {
      path: [
        { x: 0,   y: 0   },
        { x: 90,  y: -130 },
        { x: 240, y: -155 },
        { x: 370, y: -90  },
        { x: 492, y: 74   },
      ],
      curviness: 1.25,
      autoRotate: true,
    },
  }, 0.10);

  // ─── 0.36 → 0.62  :  ZOOM-OUT — MacBook revealed ───
  tl.to(deviceScene, {
    scale: 1,
    duration: 0.26,
    ease: 'expo.inOut',
  }, 0.36);

  // Ecom nav fades in as frame becomes visible
  tl.to(ecomNav, {
    opacity: 1,
    duration: 0.14,
    ease: 'power2.out',
  }, 0.52);

  // ─── 0.64 → 0.84  :  FULL PULL-BACK — all devices ───
  tl.to(deviceScene, {
    scale: 0.80,
    duration: 0.20,
    ease: 'power2.inOut',
  }, 0.64);

  // Tablet slides in from left
  tl.to(tabletDevice, {
    opacity: 1,
    x: 0,
    duration: 0.18,
    ease: 'back.out(1.2)',
  }, 0.68);

  // Phone slides in from right
  tl.to(phoneDevice, {
    opacity: 1,
    x: 0,
    duration: 0.18,
    ease: 'back.out(1.2)',
  }, 0.72);

  // Gentle ambient float at rest
  tl.to(deviceScene, {
    y: -6,
    duration: 0.16,
    ease: 'sine.inOut',
  }, 0.86);

  // ════════════════════════════════════════════════
  //  RESIZE — recompute scale and refresh triggers
  // ════════════════════════════════════════════════
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      INITIAL_SCALE = computeInitialScale();
      // Only reset to initial scale if scroll is at top
      if (window.scrollY < 50) {
        gsap.set(deviceScene, { scale: INITIAL_SCALE });
      }
      ScrollTrigger.refresh();
    }, 200);
  });

  // ════════════════════════════════════════════════
  //  REDUCED MOTION
  // ════════════════════════════════════════════════
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    ScrollTrigger.getAll().forEach(st => st.kill());
    gsap.set(deviceScene, { scale: 0.85 });
    gsap.set([heroHeadline, heroSub, scrollHint], { opacity: 1, y: 0 });
  }
</script>

</body>
</html>
