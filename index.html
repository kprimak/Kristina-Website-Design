<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not just a website — a story.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@900&family=Archivo:wght@400&display=swap" rel="stylesheet" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    /* ── RESET ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── MAGENTA BASE — CSS only, never overridden by JS ──────────── */
    html, body {
      background: #FF007F !important;
      font-family: 'Archivo', sans-serif;
      overflow-x: hidden;
    }

    /* ── SCROLL SPACE ─────────────────────────────────────────────── */
    #main-section { height: 450vh; }

    /* ── STICKY CANVAS ────────────────────────────────────────────── */
    #main-viewport {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #FF007F !important;
    }

    /* ── LOADING MASK ─────────────────────────────────────────────────
       Solid magenta div placed first in the DOM. Renders before any JS.
       It is the ONLY thing visible on page load. GSAP sets autoAlpha:0
       on it after the initial scale is applied — zero grey flash.       */
    #loading-mask {
      position: fixed;
      inset: 0;
      background: #FF007F !important;
      z-index: 9999;
      pointer-events: none;
      /* starts visible — no opacity rule here so CSS controls it */
    }

    /* ── DEVICE SCENE ─────────────────────────────────────────────────
       GSAP scales this group. Starts at INITIAL_SCALE so the laptop
       screen fills 100% of the viewport — user sees pure magenta.
       On scroll it zooms to scale:0.82 — laptop chassis appears.       */
    #device-scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      will-change: transform;
      z-index: 1;
      background: #FF007F !important;
    }

    #lateral-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FF007F !important;
    }

    /* ── SHARED DEVICE RULES ──────────────────────────────────────────
       All three devices: display:block, defined size, never display:none  */
    .device {
      display: block !important;
      height: auto;
    }
    .device svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ── TABLET ───────────────────────────────────────────────────────
       Absolute — left of the laptop in the flex row.
       Starts at opacity:0 (set by GSAP), fades in after zoom.          */
    .device.tablet {
      position: absolute;
      right: calc(100% + 20px);
      top: 50%;
      transform: translateY(-50%);
      width: 20%;
      min-width: 110px;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.22));
    }

    /* ── LAPTOP ───────────────────────────────────────────────────────
       The main flex child. Relative — sits inside the flex row.        */
    .device.laptop {
      position: relative;
      width: min(960px, 90vw);
      aspect-ratio: 1000 / 680;
      flex-shrink: 0;
      background: #FF007F !important;
      filter:
        drop-shadow(0 40px 80px rgba(0,0,0,0.32))
        drop-shadow(0 10px 24px rgba(0,0,0,0.18));
    }

    /* Magenta screen fill — visible through the transparent SVG bezel */
    .laptop-screen {
      position: absolute;
      left:   9%;
      top:    4.41%;
      width:  82%;
      height: 75%;
      overflow: hidden;
      background: #FF007F !important;
      z-index: 1;
    }

    /* Chassis SVG above the screen fill */
    .laptop-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 2;
      pointer-events: none;
    }

    /* ── PHONE ────────────────────────────────────────────────────────
       Absolute — right of the laptop.
       Starts at opacity:0 (set by GSAP), fades in after zoom.          */
    .device.phone {
      position: absolute;
      left: calc(100% + 16px);
      top: 50%;
      transform: translateY(-50%);
      width: 9.5%;
      min-width: 58px;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.22));
    }

    /* ── HEADLINE ─────────────────────────────────────────────────────
       Lives in #main-viewport (no CSS transform ancestor).
       z-index:100 reliably sits above #device-scene (z-index:1).
       GSAP fades this out as the zoom-out begins.                      */
    #headline-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 100;
      pointer-events: none;
    }

    .eyebrow {
      font-family: 'Archivo', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
      margin-bottom: 1.1rem;
    }

    h1.headline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: #ffffff !important;
      line-height: 1.18;
      letter-spacing: -0.03em;
      margin-bottom: 1.2rem;
      display: block !important;
      visibility: visible !important;
    }

    .rule {
      width: 40px;
      height: 1.5px;
      background: rgba(255,255,255,0.35);
      margin: 0 auto 1rem;
    }

    .sub {
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.55);
    }

    /* ── AFTER SECTION ────────────────────────────────────────────── */
    #after-section {
      background: #1a1a1a;
      text-align: center;
      padding: 9rem 2rem 10rem;
    }
    #after-section h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(2rem, 4vw, 3.8rem);
      color: #ffffff;
      letter-spacing: -0.04em;
      margin-bottom: 1.4rem;
    }
    #after-section p {
      max-width: 500px;
      margin: 0 auto 2.6rem;
      color: rgba(255,255,255,0.55);
      line-height: 1.78;
      font-size: 1.05rem;
    }
    .cta-btn {
      display: inline-block;
      background: #FF007F;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      padding: 1rem 2.5rem;
      border-radius: 100px;
      text-decoration: none;
    }
  </style>
</head>

<script>
  gsap.registerPlugin(ScrollTrigger);

  /* ── ELEMENTS ────────────────────────────────────────────────────── */
  var mask         = document.getElementById('loading-mask');
  var deviceScene  = document.getElementById('device-scene');
  var headlineWrap = document.getElementById('headline-wrap');
  var tablet       = document.querySelector('.device.tablet');
  var phone        = document.querySelector('.device.phone');

  /* ── INITIAL SCALE ───────────────────────────────────────────────────
     Scales #device-scene so the laptop screen fills the full viewport.
     laptop-wrap (= .device.laptop) width W = min(960, 90vw)
     screen occupies: width = W × 0.82,  height = W × 0.51
     We pick the larger axis scale so the screen covers 100%.           */
  function computeInitialScale() {
    var W = Math.min(960, window.innerWidth * 0.9);
    return Math.max(
      window.innerWidth  / (W * 0.82),
      window.innerHeight / (W * 0.51)
    ) * 1.02;
  }

  /* ── APPLY INITIAL STATES ────────────────────────────────────────────
     All gsap.set() calls execute synchronously and immediately.
     1. Scale device scene so laptop screen = viewport.
     2. Tablet and phone start at opacity:0 (rendered in DOM, not visible).
     3. Remove the loading mask — chassis is now off-screen, no grey flash. */
  var initialScale = computeInitialScale();

  gsap.set(deviceScene, {
    scale: initialScale,
    transformOrigin: 'center center',
    immediateRender: true
  });

  gsap.set([tablet, phone], {
    autoAlpha: 0,
    immediateRender: true
  });

  /* Remove mask after states are locked in */
  gsap.set(mask, { autoAlpha: 0 });

  /* ── SCROLL TIMELINE ─────────────────────────────────────────────────
     Progress 0.00–0.20 : headline fades out
     Progress 0.00–0.75 : scene zooms from initialScale → 0.82
                          (chassis emerges, devices come into frame)
     Progress 0.72–1.00 : tablet and phone fade in                      */
  var tl = gsap.timeline({
    scrollTrigger: {
      trigger:         '#main-section',
      start:           'top top',
      end:             'bottom bottom',
      scrub:           2,
      fastScrollEnd:   true,
      preventOverlaps: 'mainTimeline'
    }
  });

  tl.to(headlineWrap, {
    autoAlpha: 0,
    duration:  0.20,
    ease:      'power1.in'
  }, 0);

  tl.to(deviceScene, {
    scale:    0.82,
    duration: 0.75,
    ease:     'expo.inOut'
  }, 0);

  tl.to(tablet, {
    autoAlpha: 1,
    duration:  0.28,
    ease:      'power2.out'
  }, 0.72);

  tl.to(phone, {
    autoAlpha: 1,
    duration:  0.28,
    ease:      'power2.out'
  }, 0.72);

  /* ── RESIZE ──────────────────────────────────────────────────────── */
  window.addEventListener('resize', function () {
    gsap.set(deviceScene, { scale: computeInitialScale() });
    ScrollTrigger.refresh();
  });
</script>

</body>
</html>
