<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not just a website — a story.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@900&family=Archivo:wght@400&display=swap" rel="stylesheet" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ══ MAGENTA BASE — floods every surface before anything else loads ══ */
    html {
      background: #FF007F !important;
    }
    body {
      background: #FF007F !important;
      font-family: 'Archivo', sans-serif;
      overflow-x: hidden;
    }

    /* ══ SCROLL SPACE ══ */
    #main-section { height: 450vh; }

    /* ══ STICKY CANVAS — magenta fills 100vw × 100vh ══ */
    #main-viewport {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #FF007F !important;
    }

    /* ══ DEVICE SCENE — GSAP scales this group ══ */
    #device-scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      will-change: transform;
      z-index: 1;
      background: #FF007F !important;
    }

    #lateral-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FF007F !important;
    }

    /* MacBook chassis */
    #laptop-wrap {
      position: relative;
      width: min(960px, 90vw);
      aspect-ratio: 1000 / 680;
      flex-shrink: 0;
      background: #FF007F !important;
      filter:
        drop-shadow(0 40px 80px rgba(0,0,0,0.32))
        drop-shadow(0 10px 24px rgba(0,0,0,0.18));
    }

    /* Screen window — magenta fill behind all screen content */
    #laptop-screen-content {
      position: absolute;
      left:   9%;
      top:    4.41%;
      width:  82%;
      height: 75%;
      overflow: hidden;
      background: #FF007F !important;
      z-index: 1;
    }

    /* MacBook SVG frame */
    #laptop-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Side devices */
    #tablet-device {
      position: absolute;
      right: calc(100% + 20px);
      top: 50%;
      transform: translateY(-50%);
      width: 20%;
      min-width: 110px;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.22));
    }
    #phone-device {
      position: absolute;
      left: calc(100% + 16px);
      top: 50%;
      transform: translateY(-50%);
      width: 9.5%;
      min-width: 58px;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.22));
    }

    /* ══ HEADLINE — sits in #main-viewport (no transform ancestor)
       so z-index and centering behave correctly ══ */
    #headline-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 100;
      pointer-events: none;
    }
    #headline-eyebrow {
      font-family: 'Archivo', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
      margin-bottom: 1.1rem;
    }
    #headline-h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: #ffffff !important;
      line-height: 1.18;
      letter-spacing: -0.03em;
      margin-bottom: 1.2rem;
    }
    #headline-rule {
      width: 40px;
      height: 1.5px;
      background: rgba(255,255,255,0.35);
      margin: 0 auto 1rem;
    }
    #headline-sub {
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.55);
    }

    /* ══ AFTER SECTION ══ */
    #after-section {
      background: #1a1a1a;
      text-align: center;
      padding: 9rem 2rem 10rem;
    }
    #after-section h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(2rem, 4vw, 3.8rem);
      color: #ffffff;
      letter-spacing: -0.04em;
      margin-bottom: 1.4rem;
    }
    #after-section p {
      max-width: 500px;
      margin: 0 auto 2.6rem;
      color: rgba(255,255,255,0.55);
      line-height: 1.78;
      font-size: 1.05rem;
    }
    .cta-btn {
      display: inline-block;
      background: #FF007F;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      padding: 1rem 2.5rem;
      border-radius: 100px;
      text-decoration: none;
    }
  </style>
</head>

    <!-- HEADLINE — inside #main-viewport, NOT inside #device-scene.
         #main-viewport has no CSS transform, so z-index 100 works correctly
         and the headline cannot be trapped or clipped. -->

      <h1 id="headline-h1">not just a website —<br>a story.</h1>

<section id="after-section">
  <h2>Your story, beautifully crafted.</h2>
  <p>From the first wireframe to the final pixel — every element designed with intention, every interaction built for impact.</p>
  <a href="contact.html" class="cta-btn">Start your project</a>
</section>

<script>
  gsap.registerPlugin(ScrollTrigger);

  var deviceScene  = document.getElementById('device-scene');
  var headlineWrap = document.getElementById('headline-wrap');
  var tabletDev    = document.getElementById('tablet-device');
  var phoneDev     = document.getElementById('phone-device');

  function computeInitialScale() {
    var W = Math.min(960, window.innerWidth * 0.9);
    return Math.max(
      window.innerWidth  / (W * 0.82),
      window.innerHeight / (W * 0.51)
    ) * 1.02;
  }

  var INITIAL_SCALE = computeInitialScale();

  gsap.set(deviceScene, { scale: INITIAL_SCALE, transformOrigin: 'center center' });
  gsap.set(tabletDev,   { autoAlpha: 0 });
  gsap.set(phoneDev,    { autoAlpha: 0 });

  var tl = gsap.timeline({
    scrollTrigger: {
      trigger: '#main-section',
      start:  'top top',
      end:    'bottom bottom',
      scrub:  2,
      fastScrollEnd:   true,
      preventOverlaps: 'mainTimeline'
    }
  });

  tl.to(headlineWrap, { autoAlpha: 0, duration: 0.20, ease: 'power1.in' }, 0);
  tl.to(deviceScene,  { scale: 0.82,  duration: 0.75, ease: 'expo.inOut' }, 0);
  tl.to(tabletDev,    { autoAlpha: 1, duration: 0.25, ease: 'power2.out' }, 0.70);
  tl.to(phoneDev,     { autoAlpha: 1, duration: 0.25, ease: 'power2.out' }, 0.70);

  window.addEventListener('resize', function () {
    INITIAL_SCALE = computeInitialScale();
    ScrollTrigger.refresh();
  });
</script>
