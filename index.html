<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not just a website — a story.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Archivo:wght@400&display=swap" rel="stylesheet" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #ffffff;
    }

    #main-section { height: 225vh; }
    #ls-fo { opacity: 0; }

    #main-viewport {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
    }

    #device-scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      will-change: transform;
      z-index: 1;
      /* Hidden until GSAP sets the correct scale — prevents grey chassis flash */
      visibility: hidden;
    }

    #lateral-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .device.tablet {
      display: block;
      position: absolute;
      right: calc(100% + 20px);
      top: 50%;
      transform: translateY(-50%);
      width: 20%;
      min-width: 110px;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.35));
    }
    .device.tablet svg { display: block; width: 100%; height: auto; }

    .device.laptop {
      display: block;
      position: relative;
      width: min(960px, 90vw);
      aspect-ratio: 1000 / 680;
      flex-shrink: 0;
      filter:
        drop-shadow(0 40px 80px rgba(0,0,0,0.40))
        drop-shadow(0 10px 24px rgba(0,0,0,0.22));
    }

    .laptop-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 2;
      pointer-events: none;
    }

    .device.phone {
      display: block;
      position: absolute;
      left: calc(100% + 16px);
      top: 50%;
      transform: translateY(-50%);
      width: 9.5%;
      min-width: 58px;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.35));
    }
    .device.phone svg { display: block; width: 100%; height: auto; }

    #white-cover {
      position: absolute;
      inset: 0;
      background: #ffffff;
      z-index: 5;
      pointer-events: none;
    }

    #headline-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }
    .eyebrow {
      font-family: 'Archivo', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.45);
      margin-bottom: 1.1rem;
    }
    h1.headline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: #000000;
      line-height: 1.18;
      letter-spacing: -0.03em;
      margin-bottom: 1.25rem;
      text-transform: none;
    }
    .rule {
      width: 40px;
      height: 1.5px;
      background: rgba(0,0,0,0.2);
      margin: 0 auto 1.1rem;
      border: none;
    }
    .sub {
      font-family: 'Archivo', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      color: rgba(0,0,0,0.35);
    }

    #after-section {
      background: #0a0a0a;
      text-align: center;
      padding: 9rem 2rem 10rem;
    }
    #after-section h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(2rem, 4vw, 3.5rem);
      color: #ffffff;
      letter-spacing: -0.04em;
      margin-bottom: 1.4rem;
    }
    #after-section p {
      max-width: 480px;
      margin: 0 auto 2.4rem;
      color: rgba(255,255,255,0.45);
      line-height: 1.8;
      font-size: 1rem;
    }
    .cta-btn {
      display: inline-block;
      background: #FF007F;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      padding: 1rem 2.4rem;
      border-radius: 100px;
      text-decoration: none;
    }
  </style>
</head>

<script>
  gsap.registerPlugin(ScrollTrigger);

  var viewport     = document.getElementById('main-viewport');
  var deviceScene  = document.getElementById('device-scene');
  var headlineWrap = document.getElementById('headline-wrap');
  var tablet       = document.querySelector('.device.tablet');
  var phone        = document.querySelector('.device.phone');
  var lsFo         = document.getElementById('ls-fo');
  var whiteCover   = document.getElementById('white-cover');

  function computeInitialScale() {
    var W = Math.min(960, window.innerWidth * 0.9);
    return Math.max(
      window.innerWidth  / (W * 0.82),
      window.innerHeight / (W * 0.51)
    ) * 1.02;
  }

  var initialScale = computeInitialScale();

  // Apply scale then make visible — chassis never renders at natural size
  gsap.set(deviceScene, { scale: initialScale, transformOrigin: 'center center', visibility: 'visible', immediateRender: true });
  gsap.set([tablet, phone], { autoAlpha: 0, immediateRender: true });
  gsap.set(lsFo, { opacity: 0, immediateRender: true });

  // Scroll DOWN advances progress 0 → 1:
  //  0.00–0.35  grey → magenta colour wash
  //  0.25–0.80  zoom out: laptop chassis emerges, headline fades
  //  0.80–1.00  tablet + phone fade in
  var tl = gsap.timeline({
    scrollTrigger: {
      trigger:         '#main-section',
      start:           'top top',
      end:             'bottom bottom',
      scrub:           true,
      fastScrollEnd:   true,
      preventOverlaps: 'main'
    }
  });

  // Phase 1 — colour: white → magenta
  tl.fromTo(viewport, { backgroundColor: '#ffffff' }, { backgroundColor: '#FF007F', duration: 0.30, ease: 'none' }, 0);

  // Phase 2 — zoom out + headline fade + white cover lifts
  tl.to(headlineWrap, { autoAlpha: 0, duration: 0.15, ease: 'power1.in' }, 0.22);
  tl.to(whiteCover,   { autoAlpha: 0, duration: 0.25, ease: 'power1.in' }, 0.22);
  tl.to(deviceScene,  { scale: 0.82, duration: 0.45, ease: 'expo.inOut' }, 0.25);

  // Phase 3 — instant snap-in
  tl.to(tablet, { autoAlpha: 1, duration: 0.05, ease: 'none' }, 0.75);
  tl.to(phone,  { autoAlpha: 1, duration: 0.05, ease: 'none' }, 0.75);
  tl.to(lsFo,   { opacity: 1,   duration: 0.05, ease: 'none' }, 0.75);

  window.addEventListener('resize', function () {
    gsap.set(deviceScene, { scale: computeInitialScale() });
    ScrollTrigger.refresh();
  });
</script>
