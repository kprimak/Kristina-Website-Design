<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not just a website — a story.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Archivo:wght@400;500&display=swap" rel="stylesheet" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:   #FAF7F2;
      --charcoal:#1C1C1E;
      --muted:   #6B6B70;
      --accent:  #2563EB;
    }

    html { scroll-behavior: auto; }
    body { background: #1a1a1a; font-family: 'Archivo', sans-serif; overflow-x: hidden; }

    /* ══════════════════════════════════
       SCROLL SPACE + STICKY CANVAS
    ══════════════════════════════════ */
    #main-section { height: 350vh; }

    #main-viewport {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* ══════════════════════════════════
       DEVICE SCENE — scaled by GSAP
    ══════════════════════════════════ */
    #device-scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      will-change: transform;
    }

    #lateral-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* MacBook chassis
       SVG viewBox 1000×680
       Screen: left 9% · top 4.41% · w 82% · h 75%
    */
    #laptop-wrap {
      position: relative;
      width: min(960px, 90vw);
      aspect-ratio: 1000 / 680;
      flex-shrink: 0;
      filter:
        drop-shadow(0 50px 100px rgba(0,0,0,0.55))
        drop-shadow(0 15px 30px rgba(0,0,0,0.30));
      will-change: filter;
    }

    /* ── Screen window ──────────────────────────────────────────────
       overflow:hidden clips all screen layers to the bezel.
       background:transparent ensures zero grey fallback.
    ─────────────────────────────────────────────────────────────── */
    #laptop-screen-content {
      position: absolute;
      left:   9%;
      top:    4.41%;
      width:  82%;
      height: 75%;
      overflow: hidden;
      background: transparent !important;
      z-index: 1;
    }

    /* ── THE WHITE GRID CANVAS ─────────────────────────────────────
       Fills the laptop screen completely.
       At INITIAL_SCALE the screen fills the entire viewport,
       so this white grid IS the viewport. Pure CSS — no JS needed.
       display:flex centres the headline inside.
    ─────────────────────────────────────────────────────────────── */
    .white-grid {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #ffffff;
      background-image:
        repeating-linear-gradient(
          90deg,
          rgba(0,0,0,0.35) 0px, rgba(0,0,0,0.35) 1px,
          transparent 1px, transparent 40px
        ),
        repeating-linear-gradient(
          0deg,
          rgba(0,0,0,0.35) 0px, rgba(0,0,0,0.35) 1px,
          transparent 1px, transparent 40px
        );
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8%;
    }

    /* ── HEADLINE ─────────────────────────────────────────────────
       Lives inside the white grid so it scales with the device.
       At INITIAL_SCALE (~2.5×) it appears as a large viewport title.
       At final scale (0.82×) it appears as laptop screen UI text.
       font-size in vw naturally scales with the transform.
    ─────────────────────────────────────────────────────────────── */
    .grid-headline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: clamp(14px, 3.6vw, 42px);
      color: #000000;
      line-height: 1.18;
      letter-spacing: -0.025em;
      text-align: center;
      max-width: 680px;
      pointer-events: none;
    }

    /* Subtle rule below headline */
    .grid-rule {
      width: 32px;
      height: 1.5px;
      background: rgba(0,0,0,0.25);
      margin: 1.4em auto 0;
    }

    /* ── MacBook SVG frame ─────────────────────────────────────── */
    #laptop-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* ── Side devices (optional, no animation in this sequence) ── */
    #tablet-device, #phone-device { visibility: hidden; }
    #tablet-device {
      position: absolute;
      right: calc(100% + 20px); top: 50%;
      transform: translateY(-50%);
      width: 20%; min-width: 110px;
    }
    #phone-device {
      position: absolute;
      left: calc(100% + 16px); top: 50%;
      transform: translateY(-50%);
      width: 9.5%; min-width: 58px;
    }

    /* ══════════════════════════════════
       AFTER SECTION
    ══════════════════════════════════ */
    #after-section {
      background: var(--cream);
      text-align: center;
      padding: 9rem 2rem 10rem;
    }
    #after-section h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(2rem, 4vw, 3.8rem);
      color: var(--charcoal);
      letter-spacing: -0.04em;
      margin-bottom: 1.4rem;
    }
    #after-section p {
      max-width: 500px; margin: 0 auto 2.6rem;
      color: var(--muted); line-height: 1.78; font-size: 1.05rem;
    }
    .cta-btn {
      display: inline-block;
      background: var(--charcoal); color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600; font-size: 0.9rem;
      letter-spacing: 0.04em; padding: 1rem 2.5rem;
      border-radius: 100px; text-decoration: none;
      transition: background 0.25s, transform 0.15s, box-shadow 0.25s;
    }
    .cta-btn:hover {
      background: var(--accent);
      box-shadow: 0 8px 36px rgba(37,99,235,0.28);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════
     SEQUENCE:
     1. White grid fills viewport (INITIAL_SCALE)
        → headline centred, black text on white grid
     2. Scroll → device-scene scales down to 0.82
        → laptop chassis reveals around the screen
     3. Final state: laptop displays the white grid
        and headline as its active screen content
═══════════════════════════════════════════════ -->
<section id="main-section">
  <div id="main-viewport">

    <div id="device-scene">
      <div id="lateral-wrap">

        <!-- TABLET — left (hidden, not part of this sequence) -->
        <div id="tablet-device" aria-hidden="true">
          <svg viewBox="0 0 200 270" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="196" height="266" rx="18" fill="#1e1e22"/>
            <rect x="2" y="2" width="196" height="266" rx="18" fill="none" stroke="#38383c" stroke-width="1.2"/>
            <circle cx="100" cy="258" r="8" fill="#2a2a2e"/>
            <rect x="12" y="20" width="176" height="226" rx="3" fill="#ffffff"/>
          </svg>
        </div>

        <!-- MACBOOK -->
        <div id="laptop-wrap">

          <!-- SCREEN — clips all content to bezel -->
          <div id="laptop-screen-content">

            <!-- THE WHITE GRID CANVAS + HEADLINE
                 At INITIAL_SCALE this fills 100% of the viewport.
                 It IS the initial frame — pure CSS, always visible. -->
            <div class="white-grid">
              <h1 class="grid-headline">not just a website —<br>a story.</h1>
              <div class="grid-rule"></div>
            </div>

          </div><!-- /laptop-screen-content -->

          <!-- MacBook SVG frame — screen area transparent -->
          <svg id="laptop-svg" viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"   stop-color="#e2e2e2"/>
                <stop offset="100%" stop-color="#bababa"/>
              </linearGradient>
              <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"   stop-color="#d6d6d6"/>
                <stop offset="100%" stop-color="#a4a4a4"/>
              </linearGradient>
            </defs>
            <!-- Lid -->
            <rect x="44" y="4" width="912" height="558" rx="14" fill="url(#lidGrad)"/>
            <rect x="44" y="4" width="912" height="558" rx="14" fill="none" stroke="#9a9a9a" stroke-width="1.2"/>
            <rect x="52" y="10" width="896" height="548" rx="10" fill="#c4c4c4"/>
            <!-- Bezels — screen area x=90 y=30 w=820 h=510 stays transparent -->
            <rect x="70" y="18" width="860" height="14" fill="#141416"/>
            <rect x="70" y="18" width="20"  height="530" fill="#141416"/>
            <rect x="910" y="18" width="20" height="530" fill="#141416"/>
            <rect x="70" y="544" width="860" height="14" fill="#141416"/>
            <!-- Camera -->
            <circle cx="500" cy="12" r="4.5" fill="#222"/>
            <circle cx="500" cy="12" r="2"   fill="#0a0a0a" opacity="0.7"/>
            <!-- Hinge + base -->
            <rect x="34"  y="558" width="932" height="10" rx="2.5" fill="#868686"/>
            <rect x="44"  y="561" width="912" height="5"  fill="#a8a8a8" opacity="0.4"/>
            <path d="M 18,568 Q 18,572 22,574 L 978,574 Q 982,572 982,568 Z" fill="#bcbcbc"/>
            <path d="M 22,574 L 978,574 L 958,620 Q 954,630 920,632 L 80,632 Q 46,630 42,620 Z"
                  fill="url(#baseGrad)" stroke="#9a9a9a" stroke-width="0.8"/>
            <rect x="88"  y="578" width="824" height="38" rx="3" fill="#b0b0b0" opacity="0.4"/>
            <rect x="378" y="582" width="244" height="26" rx="5.5" fill="#b4b4b4" stroke="#a0a0a0" stroke-width="0.8"/>
            <g fill="#888" opacity="0.65">
              <rect x="100" y="585" width="2" height="18" rx="1"/>
              <rect x="107" y="585" width="2" height="18" rx="1"/>
              <rect x="114" y="585" width="2" height="18" rx="1"/>
              <rect x="121" y="585" width="2" height="18" rx="1"/>
              <rect x="128" y="585" width="2" height="18" rx="1"/>
              <rect x="135" y="585" width="2" height="18" rx="1"/>
              <rect x="853" y="585" width="2" height="18" rx="1"/>
              <rect x="860" y="585" width="2" height="18" rx="1"/>
              <rect x="867" y="585" width="2" height="18" rx="1"/>
              <rect x="874" y="585" width="2" height="18" rx="1"/>
              <rect x="881" y="585" width="2" height="18" rx="1"/>
              <rect x="888" y="585" width="2" height="18" rx="1"/>
            </g>
            <ellipse cx="102" cy="632" rx="14" ry="5" fill="#747474" opacity="0.7"/>
            <ellipse cx="898" cy="632" rx="14" ry="5" fill="#747474" opacity="0.7"/>
            <path d="M 42,632 Q 42,640 54,642 L 946,642 Q 958,640 958,632 Z" fill="#b8b8b8"/>
          </svg>

          <!-- PHONE — right (hidden, not part of this sequence) -->
          <div id="phone-device" aria-hidden="true">
            <svg viewBox="0 0 108 218" xmlns="http://www.w3.org/2000/svg">
              <rect x="0" y="0" width="108" height="218" rx="20" fill="#1a1a1e"/>
              <rect x="0" y="0" width="108" height="218" rx="20" fill="none" stroke="#333" stroke-width="1.2"/>
              <rect x="38" y="6" width="32" height="8" rx="4" fill="#111"/>
              <rect x="7" y="14" width="94" height="190" rx="8" fill="#ffffff"/>
            </svg>
          </div>

        </div><!-- /laptop-wrap -->
      </div><!-- /lateral-wrap -->
    </div><!-- /device-scene -->

  </div><!-- /main-viewport -->
</section>

<section id="after-section">
  <h2>Your story, beautifully crafted.</h2>
  <p>From the first wireframe to the final pixel — every element designed with intention, every interaction built for impact. Across every device, every screen, every scroll.</p>
  <a href="contact.html" class="cta-btn">Start your project</a>
</section>

<script>
  gsap.registerPlugin(ScrollTrigger);

  const deviceScene = document.getElementById('device-scene');

  // ── INITIAL_SCALE ────────────────────────────────────────────────────
  // Scale device-scene so the laptop screen exactly fills the viewport.
  //   laptop-wrap width  W = min(960, 90vw)
  //   screen pixel width   = W × 0.82
  //   screen pixel height  = W × (680/1000) × 0.75  =  W × 0.51
  // We want screen to fill vw and vh, take the larger scale factor.
  function computeInitialScale() {
    const W = Math.min(960, window.innerWidth * 0.9);
    return Math.max(
      window.innerWidth  / (W * 0.82),
      window.innerHeight / (W * 0.51)
    ) * 1.02; /* 2% oversize so no hairline gap at edges */
  }

  let INITIAL_SCALE = computeInitialScale();

  // Set the starting state — white grid fills the viewport
  gsap.set(deviceScene, { scale: INITIAL_SCALE, transformOrigin: 'center center' });

  // ── TIMELINE ─────────────────────────────────────────────────────────
  // Single, continuous zoom-out. No clip-path. No colour changes.
  // The white grid and headline scale down together into the laptop screen.
  const tl = gsap.timeline({
    scrollTrigger: {
      trigger: '#main-section',
      start:   'top top',
      end:     'bottom bottom',
      scrub:   1.8,
      fastScrollEnd: true,
    },
  });

  // Smooth scale-down from INITIAL_SCALE → 0.82
  // expo.inOut gives a slow start (feels like the camera is pulling back),
  // then eases to rest as the chassis locks into frame.
  tl.to(deviceScene, {
    scale: 0.82,
    duration: 1,
    ease: 'expo.inOut',
  });

  // ── Resize handler ────────────────────────────────────────────────────
  let rsz;
  window.addEventListener('resize', () => {
    clearTimeout(rsz);
    rsz = setTimeout(() => {
      INITIAL_SCALE = computeInitialScale();
      if (window.scrollY < 60) gsap.set(deviceScene, { scale: INITIAL_SCALE });
      ScrollTrigger.refresh();
    }, 220);
  });

  // ── Reduced motion ────────────────────────────────────────────────────
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    ScrollTrigger.getAll().forEach(st => st.kill());
    gsap.set(deviceScene, { scale: 0.82 });
  }
</script>

</body>
</html>
