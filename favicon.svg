<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- K upright (top half) -->
  <g transform="translate(18, 4) scale(0.64)">
    <!-- vertical stem -->
    <rect x="0" y="0" width="14" height="64" fill="#111111"/>
    <!-- upper arm -->
    <polygon points="14,0 100,0 100,14 28,32 14,32" fill="#111111"/>
    <!-- lower arm -->
    <polygon points="14,32 28,32 100,64 100,50 14,64" fill="#111111"/>
  </g>
  <!-- K inverted (bottom half) — flip vertically around y=50 -->
  <g transform="translate(18, 96) scale(0.64, -0.64)">
    <!-- vertical stem -->
    <rect x="0" y="0" width="14" height="64" fill="#111111"/>
    <!-- upper arm -->
    <polygon points="14,0 100,0 100,14 28,32 14,32" fill="#111111"/>
    <!-- lower arm -->
    <polygon points="14,32 28,32 100,64 100,50 14,64" fill="#111111"/>
  </g>
</svg>
